<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=5.0">
<meta name="theme-color" content="#123b5d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TariffApp">
<meta name="format-detection" content="telephone=no">
<title>TariffApp</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap");

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Arabic","Segoe UI",Arial,sans-serif;background:#f4f6f8;color:#172033}body{overflow-x:hidden}.hidden{display:none!important}
:root{--navy:#123b5d;--navy2:#0c2d48;--gold:#c7a35a;--bg:#f4f6f8;--card:#fff;--muted:#748091;--line:#e7ebef}
/* LOGIN */
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 15% 15%,rgba(199,163,90,.16),transparent 28%),radial-gradient(circle at 85% 80%,rgba(18,59,93,.14),transparent 32%),linear-gradient(135deg,#f7f5ef,#edf2f5)}
.login-page:before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.62) 48%,transparent 60%);transform:rotate(-7deg);pointer-events:none}.login-shell{width:min(1040px,100%);min-height:610px;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75);border-radius:30px;box-shadow:0 25px 70px rgba(18,59,93,.16);display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;position:relative;z-index:1}.login-brand{background:linear-gradient(145deg,#123b5d,#0c2d48);color:#fff;padding:55px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.login-brand:after{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(199,163,90,.35);border-radius:50%;right:-170px;bottom:-170px;box-shadow:0 0 0 45px rgba(199,163,90,.05),0 0 0 90px rgba(199,163,90,.03)}.brand-mark{width:72px;height:72px;border-radius:20px;background:linear-gradient(145deg,#d7b873,#a9823b);display:grid;place-items:center;color:#123b5d;font-size:30px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.18)}.login-brand h1{font-size:54px;letter-spacing:-2px;margin:28px 0 10px}.login-brand p{font-size:18px;line-height:1.8;opacity:.82;max-width:430px}.brand-line{height:1px;background:rgba(255,255,255,.18);margin:28px 0}.brand-points{display:grid;gap:13px}.brand-point{display:flex;gap:12px;align-items:center;font-size:14px;opacity:.9}.brand-point i{width:9px;height:9px;border-radius:50%;background:#d7b873;display:block}.login-form{padding:55px 52px;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:1.5px}.login-form h2{font-size:32px;margin:10px 0 8px}.login-form .sub{color:var(--muted);margin:0 0 30px}.field{margin-bottom:17px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:54px;border:1px solid #dfe5ea;border-radius:14px;padding:0 16px;font-size:16px;outline:none;background:#fbfcfd}.field input:focus{border-color:#7894aa;box-shadow:0 0 0 4px rgba(18,59,93,.08)}.login-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 22px;font-size:13px;color:var(--muted)}.remember{display:flex;gap:8px;align-items:center}.remember input{accent-color:var(--navy)}.login-btn{height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,#123b5d,#1a547f);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(18,59,93,.2)}.login-btn:hover{filter:brightness(1.05)}.login-msg{min-height:22px;color:#b42318;text-align:center;font-size:13px;margin-top:12px}.demo-note{margin-top:22px;padding:12px 14px;background:#f6f8fa;border:1px solid var(--line);border-radius:12px;color:#667085;font-size:12px;line-height:1.7}
/* APP */
.app{min-height:100vh;display:flex;background:var(--bg)}.sidebar{width:270px;background:linear-gradient(180deg,#123b5d,#0d304a);color:#fff;position:fixed;right:0;top:0;bottom:0;z-index:50;padding:22px 15px;overflow-y:auto}.brand-small{padding:6px 12px 20px;border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:16px}.brand-small strong{font-size:25px}.brand-small span{display:block;font-size:12px;opacity:.65;margin-top:5px}.role-badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.1);font-size:11px}.nav-group{margin:15px 0 8px;padding:0 10px;color:rgba(255,255,255,.45);font-size:10px;font-weight:800;letter-spacing:1px}.nav-item{width:100%;border:0;background:transparent;color:rgba(255,255,255,.8);padding:12px 13px;border-radius:12px;text-align:right;cursor:pointer;font-size:14px;margin:2px 0}.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.1);color:#fff}.nav-item.active{box-shadow:inset -3px 0 0 #d7b873}.main{margin-right:270px;width:calc(100% - 270px);min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.top-title h2{margin:0;font-size:20px}.top-title p{margin:4px 0 0;color:var(--muted);font-size:12px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#e9eef3;color:var(--navy);display:grid;place-items:center;font-weight:800}.content{padding:28px;max-width:1250px;margin:auto}.hero{background:linear-gradient(135deg,#123b5d,#1b567f);color:#fff;border-radius:24px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:25px;box-shadow:0 16px 40px rgba(18,59,93,.13)}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;opacity:.8}.hero-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:12px 15px;border-radius:14px;font-size:13px;white-space:nowrap}.search-panel{background:#fff;border-radius:22px;padding:18px;margin:22px 0;border:1px solid var(--line);box-shadow:0 7px 25px rgba(16,24,40,.04)}.search-wrap{position:relative}.search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:20px;color:#8b98a7}.search-input{width:100%;height:62px;border:1px solid #dfe5ea;border-radius:17px;padding:0 54px 0 18px;font-size:18px;outline:none}.search-input:focus{border-color:#7894aa;box-shadow:0 0 0 4px rgba(18,59,93,.06)}.search-meta{display:flex;justify-content:space-between;padding:10px 5px 0;color:var(--muted);font-size:12px}.result-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 21px;margin:12px 0;box-shadow:0 5px 18px rgba(16,24,40,.035)}.card-top{display:flex;justify-content:space-between;align-items:center;gap:15px;direction:ltr}.hs-code{font-size:22px;font-weight:900;color:var(--navy);letter-spacing:.4px}.duty{font-size:20px;font-weight:900}.description{font-size:17px;line-height:1.8;margin:14px 0 10px}.unit{font-size:12px;color:var(--muted)}.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:13px;border-top:1px solid #eef1f4}.intertek{font-size:12px;font-weight:800;padding:7px 10px;border-radius:9px;background:#f4f7f9}.save-btn{width:38px;height:38px;border:1px solid #e2e7eb;background:#fff;border-radius:11px;cursor:pointer;font-size:19px;color:#7d8996}.save-btn.saved{background:#f8f1df;color:#a57d2c;border-color:#ead7a8}.empty{background:#fff;border:1px dashed #d8dee4;border-radius:20px;padding:45px;text-align:center;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:7px}.mobile-menu{display:none}.overlay{display:none}
@media(max-width:900px){.login-shell{grid-template-columns:1fr;max-width:600px}.login-brand{display:none}.login-form{padding:40px 28px}.sidebar{right:auto;left:0;transform:translateX(-105%);transition:transform .28s ease;width:290px}.sidebar.open{transform:translateX(0)}.overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:45}.main{margin-right:0;width:100%}.topbar{padding:0 16px;height:68px}.mobile-menu{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:12px;background:#123b5d;color:#fff;font-size:21px;cursor:pointer}.content{padding:17px}.hero{padding:23px;align-items:flex-start}.hero h1{font-size:24px}.hero-chip{display:none}.stats{grid-template-columns:1fr}.search-input{height:56px;font-size:16px}.result-card{padding:17px}.description{font-size:15px}}

/* ADDED: language switcher, password toggle, caps note, upload, admin forms */
.lang-switch{position:absolute;top:22px;left:22px;z-index:5;display:flex;gap:6px;background:rgba(255,255,255,.85);padding:5px;border-radius:12px;border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(18,59,93,.1)}
.lang-switch button{border:0;background:transparent;padding:7px 11px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;color:#5b6675}
.lang-switch button.active{background:#123b5d;color:#fff;font-weight:700}
.lang-switch-top{display:flex;gap:5px;background:#f1f4f7;padding:4px;border-radius:10px}
.lang-switch-top button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;color:#5b6675}
.lang-switch-top button.active{background:#123b5d;color:#fff;font-weight:700}
.pw-wrap{position:relative}
.pw-wrap input{padding-inline-end:52px}
.pw-toggle{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:19px;padding:6px;color:#7d8996;line-height:1}
.caps-note{display:none;margin-top:8px;padding:9px 12px;background:#fff7e6;border:1px solid #f0d9a8;border-radius:10px;color:#8a6100;font-size:12.5px;line-height:1.6}
.caps-note.show{display:block}
.upload-row{display:flex;gap:10px;margin:14px 0}
.upload-btn{flex:1;padding:14px;background:#fff;border:1px dashed #d3dae1;border-radius:14px;font-family:inherit;font-size:14px;cursor:pointer;color:#4a5765;display:flex;align-items:center;justify-content:center;gap:8px}
.upload-btn:hover{border-color:#123b5d;color:#123b5d}
.photo-preview{display:none;margin:14px 0;position:relative;max-width:200px}
.photo-preview img{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.photo-preview .remove-photo{position:absolute;top:-9px;inset-inline-end:-9px;width:27px;height:27px;border-radius:50%;background:#123b5d;color:#fff;border:0;cursor:pointer;font-size:14px}
.notice{padding:13px 15px;background:#fff7e6;border:1px solid #f0d9a8;border-radius:12px;color:#8a6100;font-size:13px;line-height:1.7;margin:14px 0}
.form-grid{display:grid;gap:14px;margin-top:18px}
.form-grid label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.form-grid input{width:100%;height:50px;border:1px solid #dfe5ea;border-radius:13px;padding:0 15px;font-size:15px;font-family:inherit;outline:none;background:#fbfcfd}
.form-grid input:focus{border-color:#7894aa;box-shadow:0 0 0 4px rgba(18,59,93,.07)}
.btn{border:0;border-radius:13px;padding:13px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:#123b5d;color:#fff}
.btn.secondary{background:#eef2f5;color:#33414f}
.btn.danger{background:#b42318;color:#fff}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.admin-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 18px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}
.admin-row .meta{font-size:13px;color:var(--muted);margin-top:4px}
.admin-actions{display:flex;gap:8px;flex-shrink:0}
.admin-actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;font-family:inherit}
.admin-actions button.del{color:#b42318;border-color:#f0c4bf}
.modal-back{display:none;position:fixed;inset:0;background:rgba(12,30,48,.45);align-items:center;justify-content:center;z-index:80;padding:20px}
.modal-back.open{display:flex}
.modal{background:#fff;border-radius:22px;padding:28px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{margin:0 0 6px;font-size:20px}
.modal .sub{color:var(--muted);font-size:13px;margin:0}
.pill{display:inline-block;padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.free{background:#e7f6ec;color:#256d3f}
.pill.paid{background:#fdf0e6;color:#9a5b1c}
@media(max-width:900px){.lang-switch{top:14px;left:14px}}
/* ADDED: social sign-in */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--muted);font-size:12.5px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.social-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border:1px solid #dfe5ea;background:#fff;border-radius:13px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:#33414f}
.social-btn:hover{background:#f8fafb;border-color:#c3ced7}
.social-btn svg{flex-shrink:0}
@media(max-width:420px){.social-btn span{display:none}.social-btn{height:46px}}
/* ADDED: signup panel */
.switch-line{margin-top:20px;text-align:center;font-size:13.5px;color:var(--muted)}
.link-btn{border:0;background:none;color:var(--navy);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;text-decoration:underline;padding:0}
.link-btn:hover{opacity:.75}
.strength{display:flex;align-items:center;gap:10px;margin-top:9px}
.strength-bar{flex:1;height:6px;background:#e9edf1;border-radius:99px;overflow:hidden}
.strength-bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .25s ease,background .25s ease}
.strength span{font-size:12px;font-weight:700;min-width:64px;text-align:end}
/* ADDED: paywall + trial banner */
.paywall-card{width:min(440px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:28px;box-shadow:0 25px 70px rgba(18,59,93,.16);padding:42px 36px;text-align:center;position:relative;z-index:1}
.paywall-card h2{font-size:27px;margin:0 0 8px}
.paywall-card .sub{color:var(--muted);margin:0 0 24px;line-height:1.7}
.price-box{display:flex;align-items:baseline;justify-content:center;gap:7px;margin:8px 0 22px}
.price{font-size:44px;font-weight:900;color:var(--navy)}
.price-period{color:var(--muted);font-size:15px}
.perk-list{list-style:none;padding:0;margin:0 0 26px;text-align:start}
.perk-list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:10px;align-items:center}
.perk-list li:before{content:"✓";color:#2f8f4e;font-weight:900;flex-shrink:0}
.perk-list li:last-child{border-bottom:0}
.trial-banner{background:linear-gradient(135deg,#fff4e0,#fdeccd);border-bottom:1px solid #f0d9a8;color:#8a6100;padding:12px 30px;font-size:13.5px;font-weight:700;text-align:center}
@media(max-width:900px){.trial-banner{padding:11px 16px;font-size:12.5px}.paywall-card{padding:34px 24px}}
/* ADDED: settings page */
.set-h{margin:0 0 16px;font-size:16.5px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #f1f4f7;font-size:14.5px}
.set-row:last-of-type{border-bottom:0}
.set-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy);cursor:pointer}
.set-note{color:var(--muted);font-size:12.5px;line-height:1.8;margin:12px 0 0}
.set-msg{margin-top:12px;font-size:13px;min-height:18px}
.set-link{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-bottom:1px solid #f1f4f7;padding:14px 0;font-family:inherit;font-size:14.5px;color:var(--navy);cursor:pointer;text-align:start}
.set-link:last-of-type{border-bottom:0}
.set-link span{color:var(--muted);font-size:19px}
.set-link:hover{opacity:.7}
.legal-body{margin-top:14px;color:#3a4756;font-size:14px;line-height:1.9;max-height:52vh;overflow-y:auto}
.legal-body h4{margin:16px 0 6px;font-size:14.5px;color:var(--ink)}
.legal-body p{margin:0 0 10px}
/* ADDED: settings tabs */
.set-tabs{display:flex;gap:6px;overflow-x:auto;padding:5px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:18px;-webkit-overflow-scrolling:touch}
.set-tab{flex:0 0 auto;border:0;background:transparent;padding:11px 16px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;color:#5b6675;white-space:nowrap}
.set-tab.active{background:var(--navy);color:#fff;font-weight:700}
.set-tab:hover:not(.active){background:#f1f4f7}
/* ADDED: AI document proposals */
.prop-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 12px;font-weight:700;font-size:15px}
.prop-row{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.prop-check input{width:20px;height:20px;accent-color:var(--navy);cursor:pointer;margin-top:2px}
.prop-body{flex:1;min-width:0}
.prop-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prop-top strong{font-size:18px}
.prop-field{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding:5px 0;font-size:14px}
.prop-label{color:var(--muted);font-size:12.5px;min-width:82px}
.prop-old{color:#b42318;text-decoration:line-through;opacity:.75}
.prop-arrow{color:var(--muted)}
.prop-new{color:#256d3f;font-weight:700}


/* AI VISUAL REFRESH ONLY — functionality unchanged */
.ai-modern{background:transparent;padding:8px 0 0}
.ai-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:0 0 28px;padding:0 8px}
.ai-head-left{display:flex;align-items:center;gap:18px;min-width:0}
.ai-robot{width:72px;height:72px;border-radius:50%;background:#123b5d;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 10px 24px rgba(18,59,93,.16)}
.ai-robot svg{width:42px;height:42px}
.ai-head h1{margin:0;color:#10244e;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.4px}
.ai-head p{margin:5px 0 0;color:#4e678d;font-size:17px}
.ai-powered{display:flex;align-items:center;gap:10px;color:#c7a35a;font-size:14px;font-weight:700;letter-spacing:.7px;white-space:nowrap}
.ai-powered svg{width:27px;height:27px}
.ai-modern-card{background:rgba(255,255,255,.9);border:1px solid #eef1f4;border-radius:24px;padding:34px 44px 38px;box-shadow:0 12px 38px rgba(26,54,82,.07)}
.ai-intro{margin:0 0 20px;color:#10244e;font-size:22px;font-weight:500}
.ai-input-wrap{position:relative;margin-bottom:26px}
.ai-input-wrap svg{position:absolute;inset-inline-start:23px;top:50%;transform:translateY(-50%);width:28px;height:28px;pointer-events:none}
.ai-modern-input{width:100%;min-height:84px;border:1px solid #d6e0ea;border-radius:17px;background:#fff;padding:18px 22px 18px 72px;font-family:inherit;font-size:18px;color:#172033;outline:none;transition:.2s}
[dir="rtl"] .ai-modern-input{padding:18px 72px 18px 22px}
.ai-modern-input:focus{border-color:#6d8ba8;box-shadow:0 0 0 4px rgba(18,59,93,.06)}
.ai-upload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}
.ai-upload-card{min-height:168px;border:1.5px dashed #cbd7e3;border-radius:17px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-family:inherit;color:#10244e;transition:.2s;padding:18px}
.ai-upload-card:hover{border-color:#123b5d;background:#fbfdff;transform:translateY(-1px)}
.ai-upload-icon{width:52px;height:52px;margin-bottom:10px}
.ai-upload-card strong{font-size:17px;font-weight:800}
.ai-upload-card span{margin-top:5px;color:#587093;font-size:14px}
.ai-search-btn{width:100%;min-height:74px;border:0;border-radius:17px;background:linear-gradient(135deg,#245b83,#17466c);color:#fff;font-family:inherit;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:13px;cursor:pointer;box-shadow:0 8px 20px rgba(18,59,93,.12)}

/* ADDED: full-screen behaviour on phones.

   page ends up taller than the visible area. 100dvh tracks the real visible
   height; the 100vh line stays first as a fallback for older browsers. */
html{height:-webkit-fill-available}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}

  .topbar{padding-top:max(14px,calc(env(safe-area-inset-top) + 10px));
          padding-inline-start:max(16px,env(safe-area-inset-left));
          padding-inline-end:max(16px,env(safe-area-inset-right))}
  .sidebar{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}

           padding-inline-start:max(16px,env(safe-area-inset-left));
           padding-inline-end:max(16px,env(safe-area-inset-right))}
  .login-page,.paywallPage{padding-top:max(20px,env(safe-area-inset-top));
           padding-bottom:max(20px,env(safe-area-inset-bottom))}
  .toast{bottom:max(26px,calc(env(safe-area-inset-bottom) + 18px))}
}

<script>
/* ---------- Data & state ---------- */
const OWNER_EMAILS = ['alndsalih@hotmail.com'];

/* Storage that never crashes.
   Some environments (sandboxed previews, private mode) block localStorage and
   throw on access. We probe once, and fall back to an in-memory store so the
   whole app still runs — it just won't persist after a refresh there. */
const store = (function () {
  let backend = null;
  try {
    const probe = '__ta_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    backend = window.localStorage;
  } catch (e) {
    backend = null;
  }
  const mem = {};
  return {
    persistent: backend !== null,
    get(k) {
      try { return backend ? backend.getItem(k) : (k in mem ? mem[k] : null); }
      catch (e) { return k in mem ? mem[k] : null; }
    },
    set(k, v) {
      try { if (backend) { backend.setItem(k, v); return; } } catch (e) { /* fall through */ }
      mem[k] = v;
    },
    remove(k) {
      try { if (backend) { backend.removeItem(k); return; } } catch (e) { /* fall through */ }
      delete mem[k];
    }
  };
})();

function readJson(key, fallback) {
  try { return JSON.parse(store.get(key) || JSON.stringify(fallback)); }
  catch (e) { return fallback; }
}

let tariffData = JSON.parse(document.getElementById('tariff-data').textContent);
// Admin edits are layered on top of the bundled data and kept on this device.
const storedEdits = store.get('tariffapp_data');
if (storedEdits) {
  try { tariffData = JSON.parse(storedEdits); } catch (e) { /* keep bundled data */ }
}

let lang = store.get('tariffapp_lang') || 'ku';
let currentRole = 'user';
let currentEmail = '';
let currentName = '';
let currentAccess = 'none';
let currentView = 'search';
let saved = readJson('tariffapp_saved', []);
let history = readJson('tariffapp_history', []);
let freeList = readJson('tariffapp_freelist', []);
let pendingUsers = readJson('tariffapp_pending_users', []);
let auditLog = readJson('tariffapp_audit', []);
let settingsTab = 'general';
let currentChapter = null;
let recent = readJson('tariffapp_recent', []);
let editingId = null;
let pendingDeleteId = null;

function logAction(action, detail) {
  auditLog = [{
    action, detail,
    who: currentEmail || 'unknown',
    at: new Date().toISOString()
  }, ...auditLog].slice(0, 200);
  store.set('tariffapp_audit', JSON.stringify(auditLog));
}

const $ = id => document.getElementById(id);
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function persistData() { store.set('tariffapp_data', JSON.stringify(tariffData)); }

/* ---------- Language ---------- */
function setLang(l) {
  lang = l;
  store.set('tariffapp_lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = I18N[l].dir;
  document.querySelectorAll('.lang-switch button, .lang-switch-top button')
    .forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  applyStaticText();
  if (!$('app').classList.contains('hidden')) { buildNav(); renderView(currentView); }
}

function applyStaticText() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = t(el.dataset.th); });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
  const pw = $('password');
  if (pw) $('pwToggle').title = pw.type === 'password' ? t('showPw') : t('hidePw');
}

/* ---------- Password: visibility toggle + Caps Lock note ---------- */
function togglePassword() {
  const pw = $('password');
  const isHidden = pw.type === 'password';
  pw.type = isHidden ? 'text' : 'password';
  $('pwToggle').textContent = isHidden ? '🙈' : '👁';
  $('pwToggle').title = isHidden ? t('hidePw') : t('showPw');
  pw.focus();
}

function checkCaps(e) {
  // getModifierState is the reliable way to read the actual Caps Lock state.
  let on = false;
  if (e.getModifierState) on = e.getModifierState('CapsLock');
  $('capsNote').classList.toggle('show', !!on);
}

/* ---------- Navigation ---------- */
const USER_NAV = [
  ['group','navMain'],
  ['search','nSearch','⌕'], ['chapters','nChapters','▤'], ['ai','nAi','✦'],
  ['saved','nSaved','♡'], ['recent','nRecent','↺'], ['history','nHistory','◷'],
  ['group','navAccount'],
  ['info','nInfo','ⓘ'], ['settings','nSettings','⚙'],
];
const ADMIN_NAV = [
  ['group','navMain'],
  ['search','nSearch','⌕'], ['chapters','nChapters','▤'], ['ai','nAi','✦'],
  ['saved','nSaved','♡'], ['recent','nRecent','↺'], ['history','nHistory','◷'],
  ['group','navAdmin'],
  ['database','nDatabase','▦'], ['reports','nReports','▥'],
  ['group','navAccount'],
  ['info','nInfo','ⓘ'], ['settings','nSettings','⚙'],
];

function buildNav() {
  const items = currentRole === 'admin' ? ADMIN_NAV : USER_NAV;
  $('navBox').innerHTML = items.map(row => {
    if (row[0] === 'group') return `<div class="nav-group">${esc(t(row[1]))}</div>`;
    const [view, key, icon] = row;
    return `<button class="nav-item${view === currentView ? ' active' : ''}" data-view="${view}">${icon} &nbsp; ${esc(t(key))}</button>`;
  }).join('');
  $('navBox').querySelectorAll('.nav-item[data-view]').forEach(b => {
    b.addEventListener('click', () => {
      renderView(b.dataset.view);
      $('sidebar').classList.remove('open');
      $('overlay').classList.remove('open');
    });
  });
}

/* ---------- Cards ---------- */
function card(item) {
  const isSaved = saved.includes(String(item.hscode));
  return `<article class="result-card">
    <div class="card-top">
      <div class="hs-code">${esc(item.hscode)}</div>
      <div class="duty">${esc(item.duties)}</div>
    </div>
    <div class="description">${esc(item.content)}</div>
    <div class="unit">${esc(t('unit'))}: ${esc(item.unit)}</div>
    <div class="card-bottom">
      <span class="intertek">${esc(item.hscode).slice(0,2)}</span>
      <div class="card-actions">
        <button class="save-btn" onclick="copyTariff('${esc(item.hscode)}')" title="${esc(t('copy'))}">⧉</button>
        <button class="save-btn" onclick="shareTariff('${esc(item.hscode)}')" title="${esc(t('share'))}">↗</button>
        <button class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${esc(item.hscode)}')" title="${esc(t('save'))}">${isSaved ? '★' : '☆'}</button>
      </div>
    </div>
  </article>`;
}

function toggleSave(code) {
  code = String(code);
  noteRecent(code);
  saved = saved.includes(code) ? saved.filter(x => x !== code) : [...saved, code];
  store.set('tariffapp_saved', JSON.stringify(saved));
  if (currentView === 'search') { const i = $('searchInput'); if (i) search(i.value); }
  else renderView(currentView);
}

/* ---------- Search ---------- */
function search(value = '') {
  const q = value.trim().toLowerCase();
  const meta = $('searchMeta'), box = $('results');
  if (!meta || !box) return;
  if (!q) {
    meta.textContent = tariffData.length.toLocaleString('en-US') + ' ' + t('inDb');
    box.innerHTML = `<div class="empty">${esc(t('startSearch'))}</div>`;
    return;
  }
  history = [q, ...history.filter(x => x !== q)].slice(0, 30);
  store.set('tariffapp_history', JSON.stringify(history));
  const matches = tariffData.filter(x =>
    String(x.hscode).toLowerCase().includes(q) || String(x.content).toLowerCase().includes(q));
  meta.textContent = matches.length.toLocaleString('en-US') + ' ' + t('results');
  box.innerHTML = matches.length
    ? matches.slice(0, 200).map(card).join('')
    : `<div class="empty">${esc(t('noResults'))}</div>`;
}

/* ---------- AI view (text matching + photo attach) ---------- */
function handlePhoto(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.type && f.type.startsWith('image/')) {
    const r = new FileReader();
    r.onload = ev => { $('photoImg').src = ev.target.result; $('photoPreview').style.display = 'block'; };
    r.readAsDataURL(f);
  }
  $('aiNotice').style.display = 'block';
}
function clearPhoto() {
  $('photoPreview').style.display = 'none';
  $('photoImg').src = '';
  ['camIn','photoIn','fileIn'].forEach(id => { const el = $(id); if (el) el.value = ''; });
}
function runAi() {
  const q = ($('aiInput').value || '').trim().toLowerCase();
  const box = $('aiResults');
  if (!q) { box.innerHTML = ''; return; }
  const words = q.split(/\s+/).filter(w => w.length > 1);
  const scored = tariffData.map(item => {
    const c = String(item.content).toLowerCase();
    let s = 0;
    words.forEach(w => { if (c.includes(w)) s++; });
    if (String(item.hscode).includes(q)) s += 3;
    return { item, s };
  }).filter(r => r.s > 0).sort((a, b) => b.s - a.s).slice(0, 15);
  box.innerHTML = scored.length
    ? `<div class="search-meta">${scored.length} ${esc(t('results'))}</div>` + scored.map(r => card(r.item)).join('')
    : `<div class="empty">${esc(t('aiNoMatch'))}</div>`;
}

/* ---------- Admin: add / edit / delete ---------- */
function openEditor(id) {
  editingId = id;
  $('modalTitle').textContent = id === null ? t('addTitle') : t('editTitle');
  const it = id === null ? { hscode:'', content:'', unit:'', duties:'' } : tariffData.find(x => x.id === id);
  $('fHs').value = it.hscode; $('fDesc').value = it.content;
  $('fUnit').value = it.unit; $('fDuty').value = it.duties;
  $('editModal').classList.add('open');
}
function saveEditor() {
  const hs = $('fHs').value.trim(), desc = $('fDesc').value.trim();
  const unit = $('fUnit').value.trim(), duty = $('fDuty').value.trim();
  if (!hs) return;
  if (editingId === null) {
    const newId = tariffData.length ? Math.max(...tariffData.map(x => x.id)) + 1 : 1;
    tariffData.unshift({ id:newId, hscode:hs, content:desc, unit, duties:duty });
    logAction('add', hs);
  } else {
    const it = tariffData.find(x => x.id === editingId);
    it.hscode = hs; it.content = desc; it.unit = unit; it.duties = duty;
    logAction('edit', hs);
  }
  persistData();
  closeModal('editModal');
  renderView(currentView);
}
function askDelete(id) { pendingDeleteId = id; $('delModal').classList.add('open'); }
function confirmDelete() {
  const gone = tariffData.find(x => x.id === pendingDeleteId);
  tariffData = tariffData.filter(x => x.id !== pendingDeleteId);
  if (gone) logAction('delete', gone.hscode);
  persistData();
  pendingDeleteId = null;
  closeModal('delModal');
  renderView(currentView);
}
function closeModal(id) { $(id).classList.remove('open'); }

function adminRow(item) {
  return `<div class="admin-row">
    <div>
      <strong style="font-size:18px">${esc(item.hscode)}</strong>
      <div class="meta">${esc(item.content)}</div>
      <div class="meta">${esc(item.unit)} • ${esc(item.duties)}</div>
    </div>
    <div class="admin-actions">
      <button onclick="openEditor(${item.id})">${esc(t('btnEdit'))}</button>
      <button class="del" onclick="askDelete(${item.id})">${esc(t('btnDelete'))}</button>
    </div>
  </div>`;
}
function dbSearch(v) {
  const q = (v || '').trim().toLowerCase();
  const box = $('dbResults');
  if (!q) { box.innerHTML = `<div class="empty">${esc(t('dbHint'))}</div>`; return; }
  const m = tariffData.filter(x =>
    String(x.hscode).toLowerCase().includes(q) || String(x.content).toLowerCase().includes(q));
  box.innerHTML = m.length ? m.slice(0, 100).map(adminRow).join('') : `<div class="empty">${esc(t('noResults'))}</div>`;
}

/* ---------- Admin: people and access management ---------- */
function paidEndDate() {
  const d = new Date();
  if (billing.period === 'year') d.setFullYear(d.getFullYear() + 1);
  else d.setMonth(d.getMonth() + 1);
  return d.toISOString();
}
function addPerson() {
  const inp = $('personEmail'), msg = $('personMsg');
  const em = inp.value.trim().toLowerCase();
  const makeAdmin = $('personAdmin').checked;
  const access = $('personAccess').value;
  if (!em || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { msg.textContent = t('invalidEmail'); return; }
  if (OWNER_EMAILS.includes(em)) { msg.textContent = t('alreadyAdded'); return; }
  msg.textContent = '';
  const existing = accounts.find(a => a.email === em);
  const until = access === 'paid' ? paidEndDate() : '';
  if (existing) {
    existing.admin = makeAdmin;
    existing.paid = access === 'paid';
    existing.paidUntil = until;
    freeList = freeList.filter(x => x !== em);
    if (access === 'free') freeList.push(em);
    pendingUsers = pendingUsers.filter(x => x.email !== em);
    store.set('tariffapp_accounts', JSON.stringify(accounts));
    store.set('tariffapp_freelist', JSON.stringify(freeList));
    store.set('tariffapp_pending_users', JSON.stringify(pendingUsers));
    logAction('accessUpdate', em);
  } else {
    pendingUsers = pendingUsers.filter(x => x.email !== em);
    pendingUsers.push({ email: em, admin: makeAdmin, free: access === 'free', paid: access === 'paid', paidUntil: until });
    if (access === 'free' && !freeList.includes(em)) freeList.push(em);
    store.set('tariffapp_pending_users', JSON.stringify(pendingUsers));
    store.set('tariffapp_freelist', JSON.stringify(freeList));
    logAction('preapprove', em);
  }
  inp.value = '';
  $('personAdmin').checked = false;
  $('personAccess').value = 'free';
  msg.style.color = '#256d3f';
  msg.textContent = t('inviteSaved');
  openSettings('people');
}
function addFree() {
  // Keep the original function available for compatibility; the People page now uses addPerson().
  const inp = $('freeEmail');
  if (!inp) return;
  const em = inp.value.trim().toLowerCase();
  if (!em) return;
  const existing = accounts.find(a => a.email === em);
  if (existing) { setAccess(em, 'free'); return; }
  if (OWNER_EMAILS.includes(em) || freeList.includes(em)) return;
  freeList.push(em);
  store.set('tariffapp_freelist', JSON.stringify(freeList));
  openSettings('people');
}
function removeFree(em) {
  freeList = freeList.filter(x => x !== em);
  const a = accounts.find(x => x.email === em);
  if (a) a.paid = false;
  if (a) a.paidUntil = '';
  const p = pendingUsers.find(x => x.email === em);
  if (p) p.free = false;
  store.set('tariffapp_freelist', JSON.stringify(freeList));
  store.set('tariffapp_accounts', JSON.stringify(accounts));
  store.set('tariffapp_pending_users', JSON.stringify(pendingUsers));
  logAction('removeFree', em);
  openSettings('people');
}
function grantFree(em) { setAccess(em, 'free'); }
function setAccess(em, mode) {
  em = String(em).toLowerCase();
  if (OWNER_EMAILS.includes(em)) return;
  const a = accounts.find(x => x.email === em);
  const until = mode === 'paid' ? paidEndDate() : '';
  if (a) {
    a.paid = mode === 'paid';
    a.paidUntil = until;
    freeList = freeList.filter(x => x !== em);
    if (mode === 'free') freeList.push(em);
    pendingUsers = pendingUsers.filter(x => x.email !== em);
    store.set('tariffapp_accounts', JSON.stringify(accounts));
    store.set('tariffapp_freelist', JSON.stringify(freeList));
    store.set('tariffapp_pending_users', JSON.stringify(pendingUsers));
  } else {
    const p = pendingUsers.find(x => x.email === em) || { email: em, admin: false, free: false, paid: false, paidUntil: '' };
    p.free = mode === 'free'; p.paid = mode === 'paid'; p.paidUntil = until;
    pendingUsers = pendingUsers.filter(x => x.email !== em); pendingUsers.push(p);
    freeList = freeList.filter(x => x !== em);
    if (mode === 'free') freeList.push(em);
    store.set('tariffapp_pending_users', JSON.stringify(pendingUsers));
    store.set('tariffapp_freelist', JSON.stringify(freeList));
  }
  logAction(mode === 'paid' ? 'markPaid' : 'grantFree', em);
  openSettings('people');
}
function togglePaid(email) {
  const a = accounts.find(x => x.email === email);
  if (!a) return;
  if (a.paid) {
    a.paid = false; a.paidUntil = '';
  } else {
    a.paid = true; a.paidUntil = paidEndDate();
    freeList = freeList.filter(x => x !== email);
  }
  store.set('tariffapp_accounts', JSON.stringify(accounts));
  store.set('tariffapp_freelist', JSON.stringify(freeList));
  logAction(a.paid ? 'markPaid' : 'markUnpaid', email);
  openSettings('people');
}
function extendPaid(email) {
  const a = accounts.find(x => x.email === email);
  if (!a) return;
  const base = a.paidUntil && new Date(a.paidUntil).getTime() > Date.now() ? new Date(a.paidUntil) : new Date();
  if (billing.period === 'year') base.setFullYear(base.getFullYear() + 1);
  else base.setMonth(base.getMonth() + 1);
  a.paid = true; a.paidUntil = base.toISOString();
  freeList = freeList.filter(x => x !== email);
  store.set('tariffapp_accounts', JSON.stringify(accounts));
  store.set('tariffapp_freelist', JSON.stringify(freeList));
  logAction('extendPaid', email);

}

function toggleAdmin(email) {

/* ---------- Import / export / data tools ---------- */
function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const split = l => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const c = l[i];
      if (c === '"') { if (q && l[i+1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (c === ',' && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  };
  const header = split(lines[0]).map(h => h.toLowerCase());
  const col = names => header.findIndex(h => names.includes(h));
  const iHs = col(['hscode','hs_code','hs code','code']);
  const iDesc = col(['content','description','desc','name']);
  const iUnit = col(['unit','yeke']);
  const iDuty = col(['duties','duty','tariff','price']);
  if (iHs === -1) return null; // no recognizable HS column
  return lines.slice(1).map(l => {
    const c = split(l);
    return {
      hscode: (c[iHs] || '').replace(/^"|"$/g, ''),
      content: iDesc > -1 ? (c[iDesc] || '') : '',
      unit: iUnit > -1 ? (c[iUnit] || '') : '',
      duties: iDuty > -1 ? (c[iDuty] || '') : ''
    };
  }).filter(r => r.hscode);
}

function handleImport(input) {
  const f = input.files && input.files[0];
  const msg = $('impMsg');
  if (!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    let rows = null;
    const text = e.target.result;
    try {
      if (/\.json$/i.test(f.name) || text.trim().startsWith('[')) {
        const parsed = JSON.parse(text);
        rows = parsed.map(r => ({
          hscode: String(r.hscode ?? r.hs_code ?? r.code ?? ''),
          content: String(r.content ?? r.description ?? ''),
          unit: String(r.unit ?? ''),
          duties: String(r.duties ?? r.duty ?? '')
        })).filter(r => r.hscode);
      } else {
        rows = parseCsv(text);
      }
    } catch (err) { rows = null; }

    if (!rows || !rows.length) {
      msg.style.color = '#b42318';
      msg.textContent = t('importBad');
      return;
    }
    let nextId = tariffData.length ? Math.max(...tariffData.map(x => x.id)) + 1 : 1;
    let added = 0, updated = 0;
    rows.forEach(r => {
      const existing = tariffData.find(x => String(x.hscode) === String(r.hscode));
      if (existing) {
        existing.content = r.content || existing.content;
        existing.unit = r.unit || existing.unit;
        existing.duties = r.duties || existing.duties;
        updated++;
      } else {
        tariffData.unshift({ id: nextId++, ...r });
        added++;
      }
    });
    persistData();
    logAction('import', `${added} + ${updated} (${f.name})`);
    msg.style.color = '#256d3f';
    msg.textContent = `✓ ${t('importAdded')}: ${added} • ${t('importUpdated')}: ${updated}`;
    input.value = '';
  };
  reader.readAsText(f);
}

/* Who may use the app: owner, anyone on the free list, or anyone whose
   trial is still running / who has an active subscription. */
function expirePaidAccounts() {
  const now = Date.now();
  const expired = accounts.filter(a => a.paid && a.paidUntil && new Date(a.paidUntil).getTime() <= now);
  if (!expired.length) return;
  const expiredEmails = new Set(expired.map(a => a.email));
  accounts = accounts.filter(a => !expiredEmails.has(a.email));
  freeList = freeList.filter(e => !expiredEmails.has(e));
  pendingUsers = pendingUsers.filter(x => !expiredEmails.has(x.email));
  store.set('tariffapp_accounts', JSON.stringify(accounts));
  store.set('tariffapp_freelist', JSON.stringify(freeList));
  store.set('tariffapp_pending_users', JSON.stringify(pendingUsers));
}

function accessFor(email) {
  expirePaidAccounts();
  if (OWNER_EMAILS.includes(email)) return 'owner';
  if (freeList.includes(email)) return 'free';
  const a = accounts.find(x => x.email === email);
  if (a && a.admin) return 'free';
  if (a && a.paid) return 'paid';
  if (a && billing.trialDays) {
    const days = (Date.now() - new Date(a.created).getTime()) / 86400000;
    if (days < Number(billing.trialDays)) return 'trial';
  }
  return 'none';
}

function trialDaysLeft(email) {
  const a = accounts.find(x => x.email === email);
  if (!a) return 0;
  const used = (Date.now() - new Date(a.created).getTime()) / 86400000;
  return Math.max(0, Math.ceil(Number(billing.trialDays) - used));
}

function showPanel(which) {

function scorePassword(pw) {
  let s = 0;
  if (pw.length >= 8) s++;
  if (pw.length >= 12) s++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
  if (/\d/.test(pw)) s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  return Math.min(s, 4);
}

function updateStrength() {
  const pw = $('suPass').value;
  const fill = $('strengthFill'), label = $('strengthText');
  if (!pw) { fill.style.width = '0'; label.textContent = ''; return; }
  const s = scorePassword(pw);
  const pct = [15, 35, 60, 80, 100][s];
  const col = ['#d94a3d', '#e08a2e', '#e0b92e', '#5aa84f', '#2f8f4e'][s];
  const key = ['pwWeak', 'pwWeak', 'pwFair', 'pwGood', 'pwStrong'][s];
  fill.style.width = pct + '%';
  fill.style.background = col;
  label.textContent = t(key);
  label.style.color = col;
}

function doSignup() {
  const name = $('suName').value.trim();
  const email = $('suEmail').value.trim().toLowerCase();
  const pw = $('suPass').value;
  const pw2 = $('suPass2').value;
  const msg = $('signupMsg');
  msg.style.color = '#b42318';

  if (!name) { msg.textContent = t('errName'); return; }
  if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = t('errEmail'); return; }
  if (accounts.some(a => a.email === email) || OWNER_EMAILS.includes(email)) { msg.textContent = t('errExists'); return; }
  if (pw.length < 8) { msg.textContent = t('errShort'); return; }
  if (pw !== pw2) { msg.textContent = t('errMatch'); return; }
  if (!$('suTerms').checked) { msg.textContent = t('errTerms'); return; }

  const pre = pendingUsers.find(x => x.email === email);
  const account = { name, email, pw, created: new Date().toISOString(), admin: !!(pre && pre.admin), paid: !!(pre && pre.paid), paidUntil: (pre && pre.paidUntil) || '' };
  accounts.push(account);
  if (pre && pre.free && !freeList.includes(email)) freeList.push(email);
  pendingUsers = pendingUsers.filter(x => x.email !== email);
  store.set('tariffapp_accounts', JSON.stringify(accounts));
  store.set('tariffapp_freelist', JSON.stringify(freeList));
  store.set('tariffapp_pending_users', JSON.stringify(pendingUsers));
  msg.style.color = '#256d3f';
  msg.textContent = t('signupOk');
  logAction('signup', email);
  setTimeout(() => {
    showPanel('login');
    $('email').value = email;
    $('password').value = '';
    $('password').focus();
  }, 900);
}

/* ---------- Login / logout ---------- */
function openApp(role, email, name) {
  currentRole = role;
  currentEmail = email || '';
  currentName = name || '';
  currentAccess = accessFor(currentEmail);

  // Anyone without access sees the paywall instead of the app.
  if (role !== 'admin' && currentAccess === 'none') {
    showPaywall();
    return;
  }

  // Take this device's slot; any previous device of the same kind is kicked.
  claimSession(currentEmail);
  startSessionWatch();

  currentView = 'search';
  $('loginPage').classList.add('hidden');
  $('paywallPage').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('roleBadge').textContent = role.toUpperCase();
  const display = currentName || (role === 'admin' ? 'Administrator' : currentEmail || 'User');
  $('profileName').textContent = display;
  $('avatar').textContent = display.charAt(0).toUpperCase();
  buildNav();
  renderView('search');

  const banner = $('trialBanner');
  // Admin accounts and admin-assigned emails never enter the 7-day trial.
  const isAdminAccount = role === 'admin' || !!accounts.find(a => a.email === currentEmail && a.admin);
  if (currentAccess === 'trial' && !isAdminAccount) {
    banner.textContent = t('trialLeft').replace('{n}', trialDaysLeft(currentEmail));
    banner.classList.remove('hidden');
  } else {
    banner.classList.add('hidden');
  }
}

  $('loginPage').classList.add('hidden');
  $('app').classList.add('hidden');
  $('paywallPage').classList.remove('hidden');

}

function doLogin() {
  const email = $('email').value.trim().toLowerCase();
  const pass = $('password').value;
  $('loginMsg').style.color = '#b42318';
  if (!email) { $('loginMsg').textContent = t('loginErr'); return; }
  let role = null, name = '';
  expirePaidAccounts();
  const acct = accounts.find(a => a.email === email);
  if (OWNER_EMAILS.includes(email)) role = 'admin';
  else if (email.startsWith('admin@') && pass === 'admin123') role = 'admin';
  else if (acct && acct.pw === pass) { role = acct.admin ? 'admin' : 'user'; name = acct.name; }
  else if (email === 'user@tariffapp.com' && pass === 'user123') role = 'user';
  if (!role) { $('loginMsg').textContent = t('loginErr'); return; }
  $('loginMsg').textContent = '';
  if ($('remember').checked) {
    store.set('tariffapp_role', role);
    store.set('tariffapp_email', email);
  }
  openApp(role, email, name);
}

/* ---------- AI document extraction ----------
   Reads a government tariff document (PDF, image or text) and proposes
   changes. NOTHING is written to the database until the admin approves
   each row: this is official data, so a silent bad edit is unacceptable. */

let aiDocProposals = [];
let aiDocBusy = false;

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
function fileToText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.onerror = () => reject(new Error('read failed'));
    r.readAsText(file);
  });
}

async function handleAiDoc(input) {
  const f = input.files && input.files[0];
  if (!f || aiDocBusy) return;
  const status = $('aiDocStatus');
  const out = $('aiDocResults');
  aiDocBusy = true;
  aiDocProposals = [];
  out.innerHTML = '';
  status.className = 'set-msg';
  status.style.color = '';
  status.textContent = t('aiDocReading').replace('{f}', f.name);

  try {
    let userContent;
    const instruction =
      'You are reading an official customs tariff document. Extract EVERY tariff line item you can find. ' +
      'Return ONLY a JSON array, no prose, no markdown fences. Each element must be exactly: ' +
      '{"hscode":"...","content":"...","unit":"...","duties":"..."} . ' +
      'hscode = the HS/tariff code digits only. content = the goods description exactly as written in the document, in its original language. ' +
      'unit = the unit of measure as written. duties = the duty amount as written, including any currency symbol. ' +
      'If a field is genuinely absent for a row, use an empty string. Do not invent, translate, round or reformat any value. ' +
      'If the document contains no tariff line items, return [].';

    if (f.type === 'application/pdf') {
      const b64 = await fileToBase64(f);
      userContent = [
        { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 } },
        { type: 'text', text: instruction }
      ];
    } else if (f.type && f.type.startsWith('image/')) {
      const b64 = await fileToBase64(f);
      userContent = [
        { type: 'image', source: { type: 'base64', media_type: f.type, data: b64 } },
        { type: 'text', text: instruction }
      ];
    } else {
      const txt = await fileToText(f);
      userContent = [{ type: 'text', text: instruction + '\n\nDOCUMENT:\n' + txt.slice(0, 40000) }];
    }

    status.textContent = t('aiDocThinking');

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: userContent }]
      })
    });
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    const text = (data.content || []).map(c => c.text || '').join('\n');
    const cleaned = text.replace(/```json|```/g, '').trim();
    const firstBracket = cleaned.indexOf('[');
    const parsed = JSON.parse(firstBracket >= 0 ? cleaned.slice(firstBracket) : cleaned);
    if (!Array.isArray(parsed)) throw new Error('not an array');

    aiDocProposals = parsed
      .filter(r => r && String(r.hscode || '').trim())
      .map(r => {
        const hs = String(r.hscode).trim();
        const existing = tariffData.find(x => String(x.hscode) === hs);
        return {
          hscode: hs,
          content: String(r.content || '').trim(),
          unit: String(r.unit || '').trim(),
          duties: String(r.duties || '').trim(),
          existing: existing || null,
          apply: true
        };
      });

    if (!aiDocProposals.length) {
      status.style.color = '#8a6100';
      status.textContent = t('aiDocNone');
    } else {
      status.style.color = '#256d3f';
      status.textContent = t('aiDocFound')
        .replace('{n}', aiDocProposals.length)
        .replace('{new}', aiDocProposals.filter(p => !p.existing).length)
        .replace('{upd}', aiDocProposals.filter(p => p.existing).length);
      renderProposals();
    }
  } catch (err) {
    status.style.color = '#b42318';
    status.textContent = t('aiDocFail') + ' (' + err.message + ')';
  } finally {
    aiDocBusy = false;
    input.value = '';
  }
}

function renderProposals() {
  const out = $('aiDocResults');
  out.innerHTML = `
    <div class="prop-head">
      <span>${esc(t('aiDocReview'))}</span>
      <div class="btn-row" style="margin:0">
        <button class="btn secondary" onclick="toggleAllProps(true)">${esc(t('selectAll'))}</button>
        <button class="btn secondary" onclick="toggleAllProps(false)">${esc(t('selectNone'))}</button>
      </div>
    </div>
    ${aiDocProposals.map((p, i) => {
      const e = p.existing;
      const changed = k => e && String(e[k] || '') !== String(p[k] || '');
      return `<div class="prop-row">
        <label class="prop-check"><input type="checkbox" ${p.apply ? 'checked' : ''} onchange="toggleProp(${i}, this.checked)"></label>
        <div class="prop-body">
          <div class="prop-top">
            <strong>${esc(p.hscode)}</strong>
            <span class="pill ${e ? 'paid' : 'free'}">${esc(e ? t('rowUpdate') : t('rowNew'))}</span>
          </div>
          ${['content','unit','duties'].map(k => `
            <div class="prop-field">
              <span class="prop-label">${esc(t(k === 'content' ? 'fDesc' : k === 'unit' ? 'fUnit' : 'fDuty'))}</span>
              ${e && changed(k)
                ? `<span class="prop-old">${esc(e[k] || '—')}</span> <span class="prop-arrow">→</span> <span class="prop-new">${esc(p[k] || '—')}</span>`
                : `<span>${esc(p[k] || '—')}</span>`}
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
    <div class="btn-row" style="margin-top:16px">
      <button class="btn" onclick="applyProposals()">${esc(t('applySelected'))}</button>
      <button class="btn secondary" onclick="discardProposals()">${esc(t('discard'))}</button>
    </div>
    <div id="applyMsg" class="set-msg"></div>`;
}

function toggleProp(i, val) { if (aiDocProposals[i]) aiDocProposals[i].apply = val; }
function toggleAllProps(val) { aiDocProposals.forEach(p => { p.apply = val; }); renderProposals(); }
function discardProposals() { aiDocProposals = []; $('aiDocResults').innerHTML = ''; $('aiDocStatus').textContent = ''; }

function applyProposals() {
  const chosen = aiDocProposals.filter(p => p.apply);
  if (!chosen.length) return;
  let nextId = tariffData.length ? Math.max(...tariffData.map(x => x.id)) + 1 : 1;
  let added = 0, updated = 0;
  chosen.forEach(p => {
    const existing = tariffData.find(x => String(x.hscode) === p.hscode);
    if (existing) {
      if (p.content) existing.content = p.content;
      if (p.unit) existing.unit = p.unit;
      if (p.duties) existing.duties = p.duties;
      updated++;
    } else {
      tariffData.unshift({ id: nextId++, hscode: p.hscode, content: p.content, unit: p.unit, duties: p.duties });
      added++;
    }
  });
  persistData();
  logAction('aiImport', `+${added} ~${updated}`);
  const msg = $('applyMsg');
  msg.style.color = '#256d3f';
  msg.textContent = `✓ ${t('importAdded')}: ${added} • ${t('importUpdated')}: ${updated}`;
  aiDocProposals = [];
  setTimeout(() => { $('aiDocResults').innerHTML = ''; $('aiDocStatus').textContent = ''; }, 2500);
}

window.handleAiDoc = handleAiDoc; window.toggleProp = toggleProp; window.toggleAllProps = toggleAllProps;
window.applyProposals = applyProposals; window.discardProposals = discardProposals;

/* Build the plain-text version of a tariff line that gets copied or shared. */
function tariffText(item) {
  return [
    'TariffApp',
    `${t('fHs')}: ${item.hscode}`,
    `${item.content}`,
    `${t('unit')}: ${item.unit}`,
    `${t('fDuty')}: ${item.duties}`
  ].join('\n');
}

async function copyTariff(code) {
  const item = tariffData.find(x => String(x.hscode) === String(code));
  if (!item) return;
  const text = tariffText(item);
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    // Clipboard API is blocked in some sandboxed frames; fall back to a
    // hidden textarea + execCommand, which still works there.
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
  }
  toast(ok ? t('copied') : t('copyFail'));
}

async function shareTariff(code) {
  const item = tariffData.find(x => String(x.hscode) === String(code));
  if (!item) return;
  const text = tariffText(item);
  if (navigator.share) {
    try { await navigator.share({ title: 'TariffApp ' + item.hscode, text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  // No native share sheet (desktop browsers): copy instead so the text is
  // still one paste away.
  copyTariff(code);
}

let toastTimer = null;
function toast(msg) {
  let el = $('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* ---------- Device sessions ----------
   One account may hold two slots: one phone, one computer. Logging in on a
   second phone takes over the phone slot and signs the first phone out.

   The slot table lives in `store` for now, so this works across tabs of the
   same browser. Genuine cross-device enforcement needs the server to hold
   this table — see syncSessions(): that is the only function that changes
   when the backend arrives. */

function deviceKind() {
  const ua = (globalThis.navigator && navigator.userAgent) || '';
  const touch = (globalThis.navigator && navigator.maxTouchPoints) || 0;
  // iPadOS reports a desktop UA, so treat a touch-capable "Mac" as a tablet.
  const isTabletMac = /Macintosh/.test(ua) && touch > 1;
  return (/Android|iPhone|iPad|iPod|Mobile/i.test(ua) || isTabletMac) ? 'phone' : 'computer';
}

function deviceId() {
  let id = store.get('tariffapp_device');
  if (!id) {
    id = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    store.set('tariffapp_device', id);
  }
  return id;
}

function readSessions() { return readJson('tariffapp_sessions', {}); }
function writeSessions(s) { store.set('tariffapp_sessions', JSON.stringify(s)); }

/* Claim a slot for this device. Returns the id of the device that got
   kicked out, or null if the slot was free or already ours. */
function claimSession(email) {
  const kind = deviceKind();
  const id = deviceId();
  const all = readSessions();
  const mine = all[email] || {};
  const previous = mine[kind];
  mine[kind] = { id, at: Date.now(), kind };
  all[email] = mine;
  writeSessions(all);
  return previous && previous.id !== id ? previous.id : null;
}

function sessionIsMine(email) {
  const all = readSessions();
  const mine = all[email];
  if (!mine) return true;           // nothing recorded yet
  const slot = mine[deviceKind()];
  if (!slot) return true;           // our slot is free
  return slot.id === deviceId();
}

function releaseSession(email) {
  const all = readSessions();
  const mine = all[email];
  if (!mine) return;
  const kind = deviceKind();
  if (mine[kind] && mine[kind].id === deviceId()) delete mine[kind];
  all[email] = mine;
  writeSessions(all);
}

/* Poll for takeover. With a backend this becomes a realtime subscription
   instead, so the sign-out is instant rather than within a few seconds. */
let sessionTimer = null;
function startSessionWatch() {
  stopSessionWatch();
  sessionTimer = setInterval(() => {
    if (!currentEmail) return;
    if (!sessionIsMine(currentEmail)) forceSignOut();
  }, 4000);
}
function stopSessionWatch() {
  if (sessionTimer) clearInterval(sessionTimer);
  sessionTimer = null;
}

function forceSignOut() {
  stopSessionWatch();
  const kind = deviceKind();
  currentEmail = ''; currentName = ''; currentRole = 'user';
  store.remove('tariffapp_role');
  store.remove('tariffapp_email');
  $('app').classList.add('hidden');
  $('paywallPage').classList.add('hidden');
  $('loginPage').classList.remove('hidden');
  $('password').value = '';
  const msg = $('loginMsg');
  msg.style.color = '#b42318';
  msg.textContent = t('kickedOut').replace('{d}', t('dev_' + kind));
}

window.deviceKind = deviceKind;


/* ---------- Installable web app ----------
   Generates the manifest at runtime so the whole app stays a single file
   (a normal manifest.json would be a second file to host). Lets the user
   add TariffApp to their home screen and open it full-screen, without the
   browser address bar. */
(function registerManifest() {
  try {
    const icon = (size) => {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const x = c.getContext('2d');
      if (!x) return null;
      x.fillStyle = '#123b5d';
      x.fillRect(0, 0, size, size);
      x.fillStyle = '#ffffff';
      x.font = 'bold ' + Math.round(size * 0.5) + 'px Arial, sans-serif';
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.fillText('T', size / 2, size / 2 + size * 0.02);
      return c.toDataURL('image/png');
    };
    const i192 = icon(192), i512 = icon(512);
    const manifest = {
      name: 'TariffApp',
      short_name: 'TariffApp',
      start_url: '.',
      display: 'standalone',
      background_color: '#f4f6f8',
      theme_color: '#123b5d',
      orientation: 'portrait-primary',
      icons: [i192, i512].filter(Boolean).map((src, n) => ({
        src, sizes: n === 0 ? '192x192' : '512x512', type: 'image/png', purpose: 'any maskable'
      }))
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
    if (i192) {
      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = i192;
      document.head.appendChild(apple);
    }
  } catch (e) { /* manifest is a nice-to-have; never block the app for it */ }
})();
</script>
